<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorer les attractions — Pulse Label™</title>
<meta name="description" content="Classement mondial des attractions par Pulse Score. La référence internationale.">
<link rel="canonical" href="https://thepulselabel.com/explorer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#000000;--bg1:#0a0a0a;--border:#1c1c1c;--border2:#2a2a2a;
  --text:#f5f5f7;--soft:#6e6e73;--dim:#3a3a3c;
  --v:#a855f7;
  --dead:#6b7280;--rise:#22c55e;--spark:#3b82f6;
  --sig:#f97316;--ult:#ef4444;--leg:#a855f7;
  --f-head:'Syne','Segoe UI',Arial,sans-serif;
  --f-body:'Outfit','Segoe UI',Arial,sans-serif;
  --f-mono:'DM Mono','Courier New',monospace;
  --ease:cubic-bezier(.25,.1,.25,1);
}
html{font-size:16px;-webkit-font-smoothing:antialiased;}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);min-height:100vh;}

/* NAV */
nav{position:sticky;top:0;z-index:200;height:56px;padding:0 40px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.92);backdrop-filter:blur(20px);border-bottom:.5px solid var(--border);}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-mark{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.06);border:.5px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;}
.logo-text{font-family:var(--f-head);font-size:14px;font-weight:700;color:#fff;letter-spacing:.5px;}
.logo-tm{font-family:var(--f-mono);font-size:9px;color:var(--v);vertical-align:super;margin-left:1px;}
.nav-links{display:flex;align-items:center;gap:0;}
.nav-links a{font-size:12px;color:var(--soft);text-decoration:none;padding:0 16px;height:56px;display:flex;align-items:center;letter-spacing:.3px;transition:color .2s;font-weight:500;}
.nav-links a:hover,.nav-links a.active{color:#fff;}
.nav-cta{background:var(--v)!important;color:#fff!important;padding:7px 18px!important;height:auto!important;border-radius:6px;font-size:11px!important;font-weight:700!important;letter-spacing:1px!important;text-transform:uppercase!important;margin-left:8px;}

/* PAGE HEADER */
.page-header{background:#fff;border-bottom:.5px solid #e0e0e0;padding:40px 40px 32px;text-align:center;position:relative;overflow:hidden;}
.page-header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--dead),var(--rise),var(--spark),var(--sig),var(--ult),var(--leg));}
.ph-eyebrow{font-family:var(--f-mono);font-size:10px;color:var(--soft);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;display:block;}
.ph-title{font-family:var(--f-head);font-size:clamp(26px,4vw,42px);font-weight:800;color:#000;letter-spacing:-1px;margin-bottom:10px;}
.ph-title span{color:var(--v);}
.ph-meta{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px;color:var(--soft);}
.ph-meta strong{color:#000;}
.ph-sep{width:3px;height:3px;border-radius:50%;background:var(--dim);}

/* FILTERS BAR */
.filters-bar{background:var(--bg);border-bottom:.5px solid var(--border);padding:14px 40px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;}
.filter-group{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.filter-label{font-family:var(--f-mono);font-size:9px;color:var(--soft);letter-spacing:2px;text-transform:uppercase;margin-right:2px;white-space:nowrap;}
.filter-chip{padding:5px 12px;border-radius:100px;border:.5px solid var(--border2);background:transparent;font-size:11px;font-weight:500;color:var(--soft);cursor:pointer;transition:all .15s;font-family:var(--f-body);white-space:nowrap;}
.filter-chip:hover{border-color:var(--dim);color:#fff;}
.filter-chip.on{background:var(--v);border-color:var(--v);color:#fff;}
.filter-sep{width:1px;height:24px;background:var(--border);flex-shrink:0;}
.search-wrap{position:relative;}
.search-inp{background:var(--bg1);border:.5px solid var(--border2);border-radius:100px;padding:7px 16px 7px 32px;font-size:12px;font-family:var(--f-body);color:var(--text);outline:none;width:190px;transition:border-color .2s,width .3s;}
.search-inp:focus{border-color:var(--v);width:240px;}
.search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.4;}
.sort-sel{background:var(--bg1);border:.5px solid var(--border2);border-radius:100px;padding:7px 14px;font-size:11px;font-family:var(--f-body);color:var(--soft);outline:none;cursor:pointer;}

/* MAIN */
.main-content{max-width:1100px;margin:0 auto;padding:28px 40px 80px;}
.results-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px;}
.results-count{font-family:var(--f-mono);font-size:11px;color:var(--soft);}
.results-count strong{color:#fff;}
.view-btns{display:flex;gap:4px;}
.vbtn{width:30px;height:30px;border-radius:6px;border:.5px solid var(--border2);background:transparent;color:var(--soft);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.vbtn:hover{border-color:var(--dim);color:#fff;}
.vbtn.on{background:var(--v);border-color:var(--v);color:#fff;}

/* TOP 10 */
.top10-block{background:var(--bg1);border:.5px solid var(--border2);border-radius:12px;overflow:hidden;margin-bottom:28px;}
.top10-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:.5px solid var(--border);background:var(--bg);}
.top10-title-wrap{display:flex;align-items:center;gap:10px;}
.top10-title{font-family:var(--f-head);font-size:15px;font-weight:700;color:#fff;}
.top10-badge{font-family:var(--f-mono);font-size:9px;color:var(--v);border:1px solid rgba(168,85,247,.3);background:rgba(168,85,247,.08);padding:3px 10px;border-radius:100px;letter-spacing:2px;}
.top10-toggle{font-family:var(--f-mono);font-size:9px;color:var(--soft);background:none;border:none;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:color .2s;}
.top10-toggle:hover{color:#fff;}
.t10-table{width:100%;border-collapse:collapse;}
.t10-table tr{border-bottom:.5px solid var(--border);transition:background .15s;}
.t10-table tr:last-child{border-bottom:none;}
.t10-table tr:hover{background:rgba(255,255,255,.03);}
.t10-rank{font-family:var(--f-mono);font-size:11px;color:var(--dim);width:44px;padding:11px 8px 11px 20px;text-align:center;vertical-align:middle;}
.t10-rank.gold{color:#d4a017;}.t10-rank.silver{color:#9ca3af;}.t10-rank.bronze{color:#c2521a;}
.t10-cat{font-size:18px;padding:11px 8px;vertical-align:middle;width:32px;}
.t10-name{font-size:13px;font-weight:600;color:#fff;padding:11px 8px;vertical-align:middle;max-width:0;width:38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t10-park{font-family:var(--f-mono);font-size:10px;color:var(--soft);padding:11px 8px;vertical-align:middle;max-width:0;width:30%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t10-right{padding:11px 20px 11px 8px;vertical-align:middle;text-align:right;white-space:nowrap;}
.t10-score{font-family:var(--f-mono);font-size:18px;font-weight:600;line-height:1;display:block;}
.t10-level{font-family:var(--f-mono);font-size:7px;letter-spacing:2px;text-transform:uppercase;opacity:.8;display:block;margin-top:2px;}

/* CATEGORY GROUPS */
.cat-group{margin-bottom:28px;}
.cat-group-head{display:flex;align-items:center;gap:10px;padding:13px 20px;background:var(--bg1);border:.5px solid var(--border2);border-bottom:none;border-radius:10px 10px 0 0;}
.cat-group-name{font-family:var(--f-head);font-size:14px;font-weight:700;color:#fff;letter-spacing:.3px;}
.cat-group-count{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15);padding:2px 8px;border-radius:100px;}

/* Cards list */
.cards-list{border:.5px solid var(--border2);border-top:none;border-radius:0 0 10px 10px;overflow:hidden;}
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);border:.5px solid var(--border2);border-top:none;border-radius:0 0 10px 10px;overflow:hidden;gap:.5px;background:var(--border);}
.acard{background:var(--bg1);padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:.5px solid var(--border);transition:background .15s;animation:fadeUp .3s var(--ease) both;}
.acard:last-child{border-bottom:none;}
.acard:hover{background:var(--bg2);}
.cards-grid .acard{flex-direction:column;align-items:flex-start;border-bottom:none;padding:16px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
.acard-rank{font-family:var(--f-mono);font-size:10px;color:var(--dim);min-width:20px;text-align:center;flex-shrink:0;}
.acard-ico{font-size:18px;flex-shrink:0;}
.acard-body{flex:1;min-width:0;}
.acard-tag{font-family:var(--f-mono);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid;display:inline-block;margin-bottom:4px;}
.acard-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
.acard-hl{font-size:11px;color:var(--soft);}
.acard-badge{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex-shrink:0;}
.ab-score{font-family:var(--f-mono);font-size:18px;font-weight:600;line-height:1;}
.ab-level{font-family:var(--f-mono);font-size:7px;letter-spacing:2px;text-transform:uppercase;opacity:.7;}
.cards-grid .acard-badge{flex-direction:row;align-items:center;gap:8px;width:100%;margin-top:10px;}
.cards-grid .acard-rank{display:none;}

/* Empty */
.empty{text-align:center;padding:80px 20px;color:var(--soft);}
.empty-ico{font-size:40px;margin-bottom:12px;display:block;opacity:.3;}
.empty-t{font-size:16px;font-weight:600;color:var(--dim);}

/* FOOTER */
footer{border-top:.5px solid var(--border);padding:32px 40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;background:var(--bg1);}
.ft-left{display:flex;align-items:center;gap:16px;}
.ft-name{font-family:var(--f-head);font-size:13px;font-weight:700;color:#fff;letter-spacing:.5px;}
.ft-tm{font-family:var(--f-mono);font-size:8px;color:var(--v);vertical-align:super;}
.ft-copy{font-size:11px;color:var(--soft);}
.ft-dots{display:flex;gap:5px;}
.fd{width:6px;height:6px;border-radius:50%;}
.ft-links{display:flex;gap:20px;}
.ft-links a{font-size:11px;color:var(--soft);text-decoration:none;transition:color .2s;}
.ft-links a:hover{color:#000;}

/* RESPONSIVE */
@media(max-width:900px){
  nav{padding:0 20px;}.nav-links{display:none;}
  .page-header{padding:28px 20px 24px;}
  .filters-bar{padding:12px 16px;gap:8px;}
  .main-content{padding:20px 16px 60px;}
  .cards-grid{grid-template-columns:1fr;}
  .t10-park{display:none;}
  .search-inp{width:140px;}.search-inp:focus{width:180px;}
  footer{padding:24px 20px;flex-direction:column;text-align:center;}
  .ft-links,.ft-dots{justify-content:center;}
}
</style>
</head>
<body>

<nav>
  <a href="../index.html" class="logo">
    <div class="logo-mark">

        <path d="M20 128 C30 128 38 118 50 100 C60 84 68 64 80 44 C90 28 100 18 114 14 C128 10 140 18 152 34 C164 50 170 76 176 104 C180 118 184 128 196 128" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
        <line x1="20" y1="140" x2="196" y2="140" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".25"/>

<script>
const LVL=[
  {id:'legendary',label:'LEGENDARY',min:9.2,max:10,  c:'#a855f7',bg:'rgba(168,85,247,.08)',bc:'rgba(168,85,247,.3)'},
  {id:'ultimate', label:'ULTIMATE', min:8,  max:9.2, c:'#ef4444',bg:'rgba(239,68,68,.08)', bc:'rgba(239,68,68,.3)'},
  {id:'signature',label:'SIGNATURE',min:6.5,max:8,   c:'#f97316',bg:'rgba(249,115,22,.08)',bc:'rgba(249,115,22,.3)'},
  {id:'spark',    label:'SPARK',    min:5,  max:6.5, c:'#3b82f6',bg:'rgba(59,130,246,.08)',bc:'rgba(59,130,246,.3)'},
  {id:'rise',     label:'RISE',     min:3,  max:5,   c:'#22c55e',bg:'rgba(34,197,94,.08)', bc:'rgba(34,197,94,.3)'},
  {id:'dead',     label:'DEAD ZONE',min:0,  max:3,   c:'#6b7280',bg:'rgba(107,114,128,.08)',bc:'rgba(107,114,128,.3)'},
];
const CATS={rollercoaster:'🎢',darkride:'🎭',manege:'🎠',waterride:'💧',funride:'🎪',spectacle:'🎬'};
const CAT_L={rollercoaster:'Roller Coaster',darkride:'Dark Ride',manege:'Manège',waterride:'Water Ride',funride:'Fun Ride',spectacle:'Spectacle'};
const CAT_ORDER=['rollercoaster','darkride','waterride','funride','manege','spectacle'];
const lv=s=>LVL.find(l=>s>=l.min&&s<=l.max)||LVL[5];

let DB=[
  {parc:'Universal Epic Universe',ville:'Orlando',pays:'USA',nom:'Harry Potter & the Battle at the Ministry',categorie:'darkride',score:9.4,highlight:'Immersion totale · Paris magique des années 20'},
  {parc:'Universal Orlando',ville:'Orlando',pays:'USA',nom:'Hagrid Magical Creatures Motorbike Adventure',categorie:'darkride',score:9.3,highlight:'Roller dark ride · Forêt interdite'},
  {parc:'Universal Orlando',ville:'Orlando',pays:'USA',nom:'Velocicoaster',categorie:'rollercoaster',score:9.1,highlight:'Launch · Inversions · Vue sur lagon'},
  {parc:'Phantasialand',ville:'Brühl',pays:'Allemagne',nom:'Taron',categorie:'rollercoaster',score:9.0,highlight:'Launch coaster · Décor Klugheim · Record Europe'},
  {parc:'Universal Epic Universe',ville:'Orlando',pays:'USA',nom:'Stardust Racers',categorie:'rollercoaster',score:8.8,highlight:'Double piste · 100 km/h · Celestial Spin'},
  {parc:'Phantasialand',ville:'Brühl',pays:'Allemagne',nom:'F.L.Y.',categorie:'rollercoaster',score:8.7,highlight:'Flying coaster · Theming spectaculaire'},
  {parc:'Europa-Park',ville:'Rust',pays:'Allemagne',nom:'Voltron Nevera',categorie:'rollercoaster',score:8.6,highlight:'Premier coaster électrique · Record Europe'},
  {parc:'Universal Epic Universe',ville:'Orlando',pays:'USA',nom:"Mario Kart : Bowser's Challenge",categorie:'funride',score:8.5,highlight:'Réalité augmentée · Kart interactif'},
  {parc:'Universal Epic Universe',ville:'Orlando',pays:'USA',nom:'Fyre Drill',categorie:'waterride',score:8.1,highlight:'Canons à eau · Interaction totale'},
  {parc:'Europa-Park',ville:'Rust',pays:'Allemagne',nom:'Blue Fire Megacoaster',categorie:'rollercoaster',score:8.0,highlight:'Launch · Inversions · Nuit magique'},
  {parc:'Universal Epic Universe',ville:'Orlando',pays:'USA',nom:'Monsters Unchained',categorie:'darkride',score:7.6,highlight:'Robotique · Monstres classiques Universal'},
  {parc:'Europa-Park',ville:'Rust',pays:'Allemagne',nom:'Voletarium',categorie:'darkride',score:7.4,highlight:'Flying theatre · Europe vue du ciel'},
  {parc:'Disneyland Paris',ville:'Paris',pays:'France',nom:'Hyperspace Mountain',categorie:'rollercoaster',score:7.5,highlight:'Star Wars · Effets lumineux immersifs'},
  {parc:'Universal Epic Universe',ville:'Orlando',pays:'USA',nom:'Donkey Kong Minecart Madness',categorie:'rollercoaster',score:7.2,highlight:'Boom coaster · Expérience familiale'},
  {parc:'Disneyland Paris',ville:'Paris',pays:'France',nom:'Big Thunder Mountain',categorie:'rollercoaster',score:7.0,highlight:'Mine Train · Classique intemporel'},
  {parc:'Disneyland Paris',ville:'Paris',pays:'France',nom:'Star Tours',categorie:'darkride',score:6.8,highlight:'Simulateur · 70 scénarios différents'},
  {parc:'Disneyland Paris',ville:'Paris',pays:'France',nom:'Pirates of the Caribbean',categorie:'darkride',score:6.2,highlight:'Bateau guidé · Atmosphère unique'},
];

let S={q:'',lev:'all',cat:'all',sort:'score-desc',view:'list'};

function filtered(){
  let d=[...DB];
  if(S.q){const q=S.q.toLowerCase();d=d.filter(a=>a.nom.toLowerCase().includes(q)||a.parc.toLowerCase().includes(q));}
  if(S.lev!=='all') d=d.filter(a=>lv(a.score).id===S.lev);
  if(S.cat!=='all') d=d.filter(a=>a.categorie===S.cat);
  d.sort((a,b)=>{
    if(S.sort==='score-desc') return b.score-a.score;
    if(S.sort==='score-asc')  return a.score-b.score;
    if(S.sort==='name-asc')   return a.nom.localeCompare(b.nom);
    if(S.sort==='park-asc')   return a.parc.localeCompare(b.parc);
    return 0;
  });
  return d;
}

function renderTop10(){
  const top10=[...DB].sort((a,b)=>b.score-a.score).slice(0,10);
  const rkCls=i=>i===0?'gold':i===1?'silver':i===2?'bronze':'';
  const rkLbl=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1);
  document.getElementById('t10-body').innerHTML=top10.map((a,i)=>{
    const l=lv(a.score);
    return `<tr>
      <td class="t10-rank ${rkCls(i)}">${rkLbl(i)}</td>
      <td class="t10-cat">${CATS[a.categorie]||'🎡'}</td>
      <td class="t10-name" title="${a.nom}">${a.nom}</td>
      <td class="t10-park">${a.parc} · ${a.pays}</td>
      <td class="t10-right">
        <span class="t10-score" style="color:${l.c}">${a.score.toFixed(1)}</span>
        <span class="t10-level" style="color:${l.c}">${l.label}</span>
      </td>
    </tr>`;
  }).join('');
}

let top10Vis=true;
document.getElementById('top10-toggle').addEventListener('click',()=>{
  top10Vis=!top10Vis;
  document.getElementById('t10-table').style.display=top10Vis?'':'none';
  document.getElementById('top10-toggle').textContent=top10Vis?'Masquer ↑':'Afficher ↓';
});

function render(){
  const data=filtered();
  document.getElementById('hd-total').textContent=DB.length;
  document.getElementById('hd-parks').textContent=[...new Set(DB.map(a=>a.parc))].length;
  document.getElementById('hd-leg').textContent=DB.filter(a=>lv(a.score).id==='legendary').length;
  document.getElementById('res-count').textContent=data.length;
  const container=document.getElementById('results');
  if(!data.length){container.innerHTML='<div class="empty"><span class="empty-ico">⌕</span><div class="empty-t">Aucun résultat</div></div>';return;}
  const grouped={};
  CAT_ORDER.forEach(c=>{grouped[c]={items:[]};});
  data.forEach((a,i)=>{const k=a.categorie in grouped?a.categorie:'funride';grouped[k].items.push({...a,rank:i+1});});
  const wC=S.view==='grid'?'cards-grid':'cards-list';
  let html='';
  CAT_ORDER.forEach(k=>{
    const g=grouped[k];if(!g.items.length)return;
    html+=`<div class="cat-group"><div class="cat-group-head"><span class="cat-group-name">${CATS[k]} ${CAT_L[k]}</span><span class="cat-group-count">${g.items.length}</span></div><div class="${wC}">`;
    g.items.forEach((a,i)=>{
      const l=lv(a.score);
      html+=`<div class="acard" style="animation-delay:${(i*.04).toFixed(2)}s">
        <div class="acard-rank">#${a.rank}</div>
        <div class="acard-ico">${CATS[a.categorie]||'🎡'}</div>
        <div class="acard-body">
          <span class="acard-tag" style="color:${l.c};border-color:${l.bc};background:${l.bg}">${a.parc} · ${a.pays}</span>
          <div class="acard-name" title="${a.nom}">${a.nom}</div>
          <div class="acard-hl">${a.highlight||''}</div>
        </div>
        <div class="acard-badge">
          <span class="ab-score" style="color:${l.c}">${a.score.toFixed(1)}</span>
          <span class="ab-level" style="color:${l.c}">${l.label}</span>
        </div>
      </div>`;
    });
    html+=`</div></div>`;
  });
  container.innerHTML=html;
}

document.getElementById('search').addEventListener('input',e=>{S.q=e.target.value;render();});
document.getElementById('sort').addEventListener('change',e=>{S.sort=e.target.value;render();});
document.getElementById('lvl-filters').addEventListener('click',e=>{
  const b=e.target.closest('.filter-chip');if(!b)return;
  S.lev=b.dataset.l;
  document.querySelectorAll('#lvl-filters .filter-chip').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');render();
});
document.getElementById('cat-filters').addEventListener('click',e=>{
  const b=e.target.closest('.filter-chip');if(!b)return;
  S.cat=b.dataset.c;
  document.querySelectorAll('#cat-filters .filter-chip').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');render();
});
document.getElementById('vl').addEventListener('click',()=>{S.view='list';document.getElementById('vl').classList.add('on');document.getElementById('vg').classList.remove('on');render();});
document.getElementById('vg').addEventListener('click',()=>{S.view='grid';document.getElementById('vg').classList.add('on');document.getElementById('vl').classList.remove('on');render();});

renderTop10();
render();
</script>
</body>
</html>
